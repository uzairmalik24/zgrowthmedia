<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Z Growth Media | SEO, AEO & GEO — Next-Gen Digital Growth Agency</title>

  <meta name="description"
    content="Z Growth Media scales brands with traditional SEO, AI-era Answer Engine Optimization (AEO), and Generative Experience Optimization (GEO) — plus full-service social media marketing and media platform management." />

  <meta name="keywords"
    content="Z Growth Media, SEO agency, AEO, GEO, AI search optimization, ChatGPT SEO, social media marketing, SMM, digital marketing agency, Google SGE optimization" />

  <meta name="author" content="Z Growth Media" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.zgrowthmedia.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/main-logo-light.png" />

  <!-- Theme color (for mobile browsers) -->
  <meta name="theme-color" content="#1e3a8a" />

  <!-- Open Graph (LinkedIn, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Z Growth Media | SEO, AEO & GEO — Next-Gen Digital Growth" />
  <meta property="og:description"
    content="Scaling brands via traditional SEO and next-gen AI optimization (AEO/GEO). Full-service SMM and media platform management." />
  <meta property="og:image" content="https://www.zgrowthmedia.com/images/main-logo-light.png" />
  <meta property="og:url" content="https://www.zgrowthmedia.com/" />
  <meta property="og:site_name" content="Z Growth Media" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Z Growth Media | SEO, AEO & GEO — Next-Gen Digital Growth" />
  <meta name="twitter:description"
    content="Scaling brands via traditional SEO and next-gen AI optimization (AEO/GEO)." />
  <meta name="twitter:image" content="https://www.zgrowthmedia.com/images/main-logo-light.png" />

  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Z Growth Media",
    "url": "https://www.zgrowthmedia.com/",
    "logo": "https://www.zgrowthmedia.com/images/main-logo-light.png",
    "description": "Digital marketing agency specializing in SEO, AEO, GEO, social media marketing, and media platform management.",
    "founder": { "@type": "Person", "name": "M. Zain" },
    "sameAs": [
      "{{LINKEDIN_URL}}",
      "{{TWITTER_URL}}",
      "{{INSTAGRAM_URL}}"
    ],
    "address": [
      {
        "@type": "PostalAddress",
        "addressCountry": "GB",
        "streetAddress": "{{UK_OFFICE_ADDRESS}}"
      },
      {
        "@type": "PostalAddress",
        "addressCountry": "PK",
        "streetAddress": "{{PK_OFFICE_ADDRESS}}"
      }
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "{{WHATSAPP_NUMBER}}",
      "contactType": "customer service",
      "availableLanguage": ["English"]
    }
  }
  </script>

  <!-- Service Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Digital Marketing",
    "provider": { "@type": "Organization", "name": "Z Growth Media" },
    "areaServed": "Worldwide",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Z Growth Media Services",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Search Engine Optimization (SEO)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Answer Engine Optimization (AEO)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Generative Experience Optimization (GEO)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Marketing (SMM)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Media Platform Management" } }
      ]
    }
  }
  </script>

  <!-- Google Analytics 4 — replace G-XXXXXXXXXX with your measurement ID -->
  <!--
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  -->

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
